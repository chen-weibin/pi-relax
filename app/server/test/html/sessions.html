<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>relax · 会话联调</title>
		<script src="cdn/tailwind.js"></script>
		<style>
			html,
			body {
				font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
					"Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
			}
			code,
			pre,
			textarea {
				font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
			}
		</style>
	</head>
	<body class="h-screen overflow-hidden bg-zinc-50 text-zinc-900 antialiased">
		<div class="flex h-full flex-col">
			<header class="flex shrink-0 items-center gap-3 border-b border-zinc-200 bg-white px-4 py-2.5">
				<a class="text-sm font-semibold tracking-tight" href="./index.html">会话联调</a>
				<label class="flex min-w-0 flex-1 items-center gap-2 rounded-md border border-zinc-200 px-2 py-1 text-xs">
					<span class="shrink-0 text-zinc-400">服务</span>
					<input id="base" class="min-w-0 flex-1 bg-transparent outline-none" value="http://127.0.0.1:3001" spellcheck="false" />
				</label>
				<span id="sse-status" class="rounded-full bg-zinc-100 px-2 py-0.5 text-[11px] font-medium text-zinc-500">SSE 未连接</span>
				<a class="text-xs text-zinc-500 hover:text-zinc-800" href="./api.html">单接口调试</a>
			</header>

			<div class="grid min-h-0 flex-1 grid-cols-[220px_minmax(0,1fr)_minmax(320px,1fr)]">
				<aside class="flex min-h-0 flex-col border-r border-zinc-200 bg-white">
					<div class="flex shrink-0 items-center justify-between px-3 py-2">
						<span class="text-xs font-medium text-zinc-500">会话列表</span>
						<button id="refresh" class="text-xs text-violet-600 hover:underline" type="button">刷新</button>
					</div>
					<label class="shrink-0 px-3 pb-2 text-[11px] text-zinc-400">
						cwd 过滤
						<input id="cwd-filter" class="mt-1 w-full rounded-md border border-zinc-200 px-2 py-1 text-xs text-zinc-800 outline-none" placeholder="空则全部" spellcheck="false" />
					</label>
					<div id="list" class="min-h-0 flex-1 overflow-auto px-2 pb-2"></div>
				</aside>

				<section class="flex min-h-0 flex-col overflow-hidden bg-zinc-50">
					<div class="shrink-0 border-b border-zinc-200 bg-white p-3">
						<p class="text-xs text-zinc-500">
							当前
							<code id="current-id" class="ml-1 text-zinc-800">无（发送即新建）</code>
							<span id="current-status" class="ml-2 text-zinc-400"></span>
						</p>
						<label class="mt-2 block text-[11px] text-zinc-400">
							cwd（仅新建时用）
							<input id="cwd" class="mt-1 w-full rounded-md border border-zinc-200 px-2 py-1 text-xs text-zinc-800 outline-none" spellcheck="false" />
						</label>
						<textarea id="text" rows="3" class="mt-2 w-full resize-none rounded-md border border-zinc-200 p-2 text-sm outline-none focus:border-violet-300" placeholder="没有当前会话则新建并发送，有则续发"></textarea>
						<div class="mt-2 grid grid-cols-2 gap-2">
							<label class="text-[11px] text-zinc-400">
								思考档位
								<select id="thinking" class="mt-1 w-full rounded-md border border-zinc-200 bg-white px-2 py-1 text-xs text-zinc-800 outline-none">
									<option value="">不改（新建默认 medium）</option>
									<option>off</option>
									<option>minimal</option>
									<option>low</option>
									<option>medium</option>
									<option>high</option>
									<option>xhigh</option>
									<option>max</option>
								</select>
							</label>
							<label class="text-[11px] text-zinc-400">
								生成中插队（仅续发）
								<select id="queue" class="mt-1 w-full rounded-md border border-zinc-200 bg-white px-2 py-1 text-xs text-zinc-800 outline-none">
									<option value="">不插队，忙则 409</option>
									<option value="steer">steer：当前回复和工具后、下次模型前</option>
									<option value="followUp">followUp：本轮全部结束后</option>
								</select>
							</label>
						</div>
						<div class="mt-2 flex gap-2">
							<input id="session-name" class="min-w-0 flex-1 rounded-md border border-zinc-200 px-2 py-1 text-xs outline-none" placeholder="标题。空着再点设置即清空 name" spellcheck="false" />
							<button id="rename" class="shrink-0 rounded-md border border-zinc-200 bg-white px-3 py-1.5 text-sm hover:bg-zinc-50" type="button">设置标题</button>
						</div>
						<div class="mt-2">
							<div class="flex items-center justify-between text-[11px] text-zinc-400">
								<span>可用模型</span>
								<span id="model-usage" class="truncate pl-2 text-zinc-500">尚未加载</span>
							</div>
							<div class="mt-1 flex gap-2">
								<select id="model-pick" class="min-w-0 flex-1 rounded-md border border-zinc-200 bg-white px-2 py-1 text-xs text-zinc-800 outline-none">
									<option value="">无可用模型</option>
								</select>
								<button id="reload-models" class="shrink-0 rounded-md border border-zinc-200 bg-white px-3 py-1.5 text-sm hover:bg-zinc-50" type="button">刷新</button>
								<button id="levels" class="shrink-0 rounded-md border border-zinc-200 bg-white px-3 py-1.5 text-sm hover:bg-zinc-50" type="button">查询档位</button>
							</div>
						</div>
						<div class="mt-2 flex flex-wrap gap-2">
							<button id="send" class="rounded-md bg-violet-600 px-3 py-1.5 text-sm text-white hover:bg-violet-700" type="button">发送</button>
							<button id="abort" class="rounded-md border border-zinc-200 bg-white px-3 py-1.5 text-sm hover:bg-zinc-50" type="button">中止</button>
							<button id="info" class="rounded-md border border-zinc-200 bg-white px-3 py-1.5 text-sm hover:bg-zinc-50" type="button">信息</button>
							<button id="history" class="rounded-md border border-zinc-200 bg-white px-3 py-1.5 text-sm hover:bg-zinc-50" type="button">历史</button>
							<button id="remove" class="rounded-md border border-red-200 bg-white px-3 py-1.5 text-sm text-red-600 hover:bg-red-50" type="button">删除</button>
							<button id="clear-current" class="rounded-md px-3 py-1.5 text-sm text-zinc-500 hover:text-zinc-800" type="button">取消选中</button>
						</div>
						<p id="http-meta" class="mt-2 text-[11px] text-zinc-400">未发 HTTP</p>
					</div>
					<pre id="main" class="min-h-0 flex-1 overflow-auto whitespace-pre-wrap break-words p-4 text-[12px] leading-relaxed text-zinc-800">点「历史」把当前会话的 buildSessionContext 打在这里。</pre>
				</section>

				<aside class="flex min-h-0 flex-col border-l border-zinc-200 bg-zinc-950">
					<div class="flex shrink-0 items-center justify-between px-3 py-2">
						<span class="text-xs font-medium text-zinc-400">SSE</span>
						<button id="clear-log" class="text-xs text-zinc-500 hover:text-zinc-200" type="button">清空</button>
					</div>
					<pre id="log" class="min-h-0 flex-1 overflow-auto whitespace-pre-wrap break-words p-3 text-[11px] leading-relaxed text-zinc-300"></pre>
				</aside>
			</div>
		</div>

		<script>
			const $ = (id) => document.getElementById(id)
			const savedBase = localStorage.getItem("relax-api-base")
			if (savedBase) $("base").value = savedBase

			let source = null
			let reconnectTimer = 0
			let availableModels = []
			let defaultModel = null
			let sessionModel = null
			let currentId = null

			function base() {
				return $("base").value.replace(/\/$/, "")
			}

			function setSseStatus(text, ok) {
				const el = $("sse-status")
				el.textContent = text
				el.className =
					"rounded-full px-2 py-0.5 text-[11px] font-medium " +
					(ok ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-800")
			}

			function appendLog(line) {
				const el = $("log")
				el.textContent += line + "\n"
				el.scrollTop = el.scrollHeight
			}

			function setCurrent(id, status) {
				currentId = id || null
				$("current-id").textContent = currentId || "无（发送即新建）"
				$("current-status").textContent = status || ""
				paintList()
			}

			function connectSse() {
				clearTimeout(reconnectTimer)
				if (source) {
					source.onopen = null
					source.onerror = null
					source.onmessage = null
					source.close()
					source = null
				}
				const url = base() + "/api/sessions/events"
				source = new EventSource(url)
				setSseStatus("SSE 连接中…", false)
				source.onopen = () => setSseStatus("SSE 已连接", true)
				source.onmessage = (message) => {
					appendLog(message.data)
				}
				source.onerror = () => {
					setSseStatus("SSE 断开，重连中…", false)
					if (!source || source.readyState === EventSource.CLOSED) {
						clearTimeout(reconnectTimer)
						reconnectTimer = setTimeout(connectSse, 1000)
					}
				}
			}

			async function request(method, path, body) {
				const started = performance.now()
				const res = await fetch(base() + path, {
					method,
					headers: body ? { "content-type": "application/json" } : undefined,
					body: body ? JSON.stringify(body) : undefined,
				})
				const raw = await res.text()
				let parsed = raw
				try {
					parsed = raw ? JSON.parse(raw) : ""
				} catch {}
				$("http-meta").textContent =
					method + " " + path + " → " + res.status + "  " + Math.round(performance.now() - started) + "ms"
				if (!res.ok) {
					const message =
						typeof parsed === "object" && parsed && parsed.error
							? parsed.error.message
							: raw || res.statusText
					throw new Error(message)
				}
				return parsed
			}

			function showMain(value) {
				$("main").textContent =
					typeof value === "string" ? value : JSON.stringify(value, null, 2)
			}

			function itemLabel(item) {
				return item.name || item.firstMessage || item.id
			}

			let lastSessions = []

			function paintList() {
				const box = $("list")
				box.replaceChildren()
				if (!lastSessions.length) {
					const empty = document.createElement("p")
					empty.className = "px-1 text-xs text-zinc-400"
					empty.textContent = "暂无会话"
					box.append(empty)
					return
				}
				for (const item of lastSessions) {
					const btn = document.createElement("button")
					btn.type = "button"
					btn.dataset.id = item.id
					btn.className =
						"mb-1 w-full rounded-md px-2 py-1.5 text-left text-xs " +
						(item.id === currentId ? "bg-violet-50 text-violet-800" : "text-zinc-700 hover:bg-zinc-50")
					const title = document.createElement("div")
					title.className = "truncate font-medium"
					title.textContent = itemLabel(item).slice(0, 48)
					const meta = document.createElement("div")
					meta.className = "truncate text-[10px] text-zinc-400"
					meta.textContent = item.status + " · " + item.id.slice(0, 8)
					btn.append(title, meta)
					box.append(btn)
				}
			}

			async function loadList() {
				const cwd = $("cwd-filter").value.trim()
				const query = cwd ? "?cwd=" + encodeURIComponent(cwd) : ""
				const data = await request("GET", "/api/sessions" + query)
				lastSessions = data.sessions || []
				paintList()
			}

			$("list").addEventListener("click", (event) => {
				const btn = event.target.closest("button[data-id]")
				if (!btn) return
				const item = lastSessions.find((row) => row.id === btn.dataset.id)
				setCurrent(btn.dataset.id, item ? item.status : "")
				loadSessionModel(btn.dataset.id).catch((err) => showMain(err.message))
			})

			function modelKey(provider, id) {
				return provider + "\t" + id
			}

			function parseModelKey(value) {
				const index = value.indexOf("\t")
				if (index <= 0) return null
				return { provider: value.slice(0, index), id: value.slice(index + 1) }
			}

			function modelLabel(provider, id) {
				return provider + "/" + id
			}

			function paintModel() {
				const select = $("model-pick")
				const selected = select.value
				select.replaceChildren()
				if (!availableModels.length && !sessionModel) {
					const empty = document.createElement("option")
					empty.value = ""
					empty.textContent = "无可用模型"
					select.append(empty)
				}
				const seen = new Set()
				for (const model of availableModels) {
					const key = modelKey(model.provider, model.id)
					seen.add(key)
					const option = document.createElement("option")
					option.value = key
					const isDefault =
						defaultModel && defaultModel.provider === model.provider && defaultModel.id === model.id
					option.textContent =
						(model.name || model.id) + " · " + modelLabel(model.provider, model.id) + (isDefault ? " · 默认" : "")
					select.append(option)
				}
				if (sessionModel) {
					const key = modelKey(sessionModel.provider, sessionModel.modelId)
					if (!seen.has(key)) {
						const option = document.createElement("option")
						option.value = key
						option.textContent = modelLabel(sessionModel.provider, sessionModel.modelId) + " · 当前会话，不在可用列表"
						select.append(option)
					}
				}
				const fallback = defaultModel ? modelKey(defaultModel.provider, defaultModel.id) : ""
				const prefer = sessionModel
					? modelKey(sessionModel.provider, sessionModel.modelId)
					: [...select.options].some((option) => option.value && option.value === selected)
						? selected
						: fallback
				if ([...select.options].some((option) => option.value === prefer)) select.value = prefer
				else if (select.options.length) select.selectedIndex = 0

				if (currentId && sessionModel) {
					$("model-usage").textContent = "当前会话 " + modelLabel(sessionModel.provider, sessionModel.modelId)
				} else if (currentId) {
					$("model-usage").textContent = "当前会话还没有模型"
				} else {
					const picked = parseModelKey(select.value)
					$("model-usage").textContent = picked
						? "新建将使用 " + modelLabel(picked.provider, picked.id)
						: "没有可用模型，新建会 409"
				}
			}

			async function loadModels() {
				const listed = await request("GET", "/api/models")
				const defaults = await request("GET", "/api/models/default")
				availableModels = listed.models || []
				defaultModel = defaults.model || null
				paintModel()
			}

			async function loadSessionModel(id) {
				if (!id) {
					sessionModel = null
					paintModel()
					return
				}
				const history = await request("GET", "/api/sessions/" + encodeURIComponent(id) + "/history")
				sessionModel = history.model || null
				paintModel()
			}

			function applyThinkingLevels(levels) {
				const supported = new Set(levels || [])
				for (const option of $("thinking").options) {
					if (!option.value) continue
					option.disabled = supported.size > 0 && !supported.has(option.value)
				}
			}

			function promptBody(text) {
				const body = { text }
				const thinking = $("thinking").value
				if (thinking) body.thinkingLevel = thinking
				if (!currentId) {
					const cwd = $("cwd").value.trim()
					if (cwd) body.cwd = cwd
				} else if ($("queue").value) {
					body.streamingBehavior = $("queue").value
				}
				return body
			}

			async function send() {
				const text = $("text").value.trim()
				if (!text) return
				const creating = !currentId
				const body = promptBody(text)
				const picked = parseModelKey($("model-pick").value)
				if (picked) {
					body.provider = picked.provider
					body.model = picked.id
				}
				const path = currentId ? "/api/sessions/" + encodeURIComponent(currentId) + "/prompt" : "/api/sessions"
				const record = await request("POST", path, body)
				if (creating && picked) {
					sessionModel = { provider: picked.provider, modelId: picked.id }
					defaultModel = { provider: picked.provider, id: picked.id, usable: true }
				} else if (picked) {
					sessionModel = { provider: picked.provider, modelId: picked.id }
				}
				setCurrent(record.id, record.status)
				paintModel()
				$("text").value = ""
				await loadList()
			}

			$("base").addEventListener("change", () => {
				localStorage.setItem("relax-api-base", $("base").value)
				connectSse()
				loadModels().catch((err) => showMain(err.message))
				loadList().catch((err) => showMain(err.message))
			})
			$("refresh").addEventListener("click", () => {
				loadList().catch((err) => showMain(err.message))
			})
			$("send").addEventListener("click", () => {
				send().catch((err) => showMain(err.message))
			})
			$("text").addEventListener("keydown", (event) => {
				if (event.key === "Enter" && !event.shiftKey) {
					event.preventDefault()
					send().catch((err) => showMain(err.message))
				}
			})
			$("abort").addEventListener("click", () => {
				if (!currentId) return showMain("先在左侧点一条会话，或先发送新建。")
				request("POST", "/api/sessions/" + currentId + "/abort")
					.then((record) => {
						setCurrent(record.id, record.status)
						showMain(record)
						return loadList()
					})
					.catch((err) => showMain(err.message))
			})
			$("info").addEventListener("click", () => {
				if (!currentId) return showMain("先在左侧点一条会话，或先发送新建。")
				request("GET", "/api/sessions/" + currentId)
					.then((record) => {
						setCurrent(record.id, record.status)
						showMain(record)
					})
					.catch((err) => showMain(err.message))
			})
			$("history").addEventListener("click", () => {
				if (!currentId) return showMain("先在左侧点一条会话，或先发送新建。")
				request("GET", "/api/sessions/" + currentId + "/history")
					.then(showMain)
					.catch((err) => showMain(err.message))
			})
			$("remove").addEventListener("click", () => {
				if (!currentId) return showMain("先在左侧点一条会话，或先发送新建。")
				request("DELETE", "/api/sessions/" + currentId)
					.then(() => {
						sessionModel = null
						setCurrent(null)
						paintModel()
						showMain("已删除")
						return loadList()
					})
					.catch((err) => showMain(err.message))
			})
			$("rename").addEventListener("click", () => {
				if (!currentId) return showMain("先在左侧点一条会话，或先发送新建。")
				request("POST", "/api/sessions/" + encodeURIComponent(currentId) + "/name", {
					name: $("session-name").value,
				})
					.then((record) => {
						setCurrent(record.id, record.status)
						showMain(record)
						return loadList()
					})
					.catch((err) => showMain(err.message))
			})
			$("levels").addEventListener("click", () => {
				const picked = parseModelKey($("model-pick").value)
				if (!picked) return showMain("先选出一个模型。")
				const path =
					"/api/models/thinking-levels?provider=" +
					encodeURIComponent(picked.provider) +
					"&id=" +
					encodeURIComponent(picked.id)
				request("GET", path)
					.then((body) => {
						applyThinkingLevels(body.thinkingLevels)
						showMain(body)
					})
					.catch((err) => showMain(err.message))
			})
			$("reload-models").addEventListener("click", () => {
				loadModels().catch((err) => showMain(err.message))
			})
			$("model-pick").addEventListener("change", () => {
				const picked = parseModelKey($("model-pick").value)
				if (!picked) {
					$("model-usage").textContent = "没有可用模型，新建会 409"
					return
				}
				const previous = sessionModel
				if (!currentId) {
					$("model-usage").textContent = "新建将使用 " + modelLabel(picked.provider, picked.id)
					return
				}
				request("POST", "/api/sessions/" + encodeURIComponent(currentId) + "/model", {
					provider: picked.provider,
					model: picked.id,
				})
					.then(() => {
						defaultModel = { provider: picked.provider, id: picked.id, usable: true }
						const current = sessionModel
							? modelLabel(sessionModel.provider, sessionModel.modelId)
							: "还没有模型"
						$("model-usage").textContent =
							"默认已改为 " +
							modelLabel(picked.provider, picked.id) +
							"。当前会话仍是 " +
							current +
							"，发送后如果不同才会改"
					})
					.catch((err) => {
						sessionModel = previous
						paintModel()
						showMain(err.message)
					})
			})
			$("clear-current").addEventListener("click", () => {
				sessionModel = null
				setCurrent(null)
				$("model-pick").value = ""
				paintModel()
			})
			$("clear-log").addEventListener("click", () => {
				$("log").textContent = ""
			})

			connectSse()
			loadModels().catch((err) => showMain(err.message))
			loadList().catch((err) => showMain(err.message))
		</script>
	</body>
</html>
