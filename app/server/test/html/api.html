<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>relax · API 调试</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			html,
			body {
				font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
					"Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
				font-feature-settings: "tnum";
			}
			code,
			pre,
			kbd {
				font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas,
					"Liberation Mono", "Courier New", monospace;
			}
			body::before {
				content: "";
				position: fixed;
				inset: 0;
				background: radial-gradient(
						ellipse 60% 40% at 50% -10%,
						rgba(244, 207, 232, 0.4),
						transparent 70%
					),
					radial-gradient(
						ellipse 40% 30% at 88% 5%,
						rgba(199, 210, 254, 0.28),
						transparent 70%
					);
				pointer-events: none;
				z-index: 0;
			}
			::-webkit-scrollbar {
				width: 8px;
				height: 8px;
			}
			::-webkit-scrollbar-track {
				background: transparent;
			}
			::-webkit-scrollbar-thumb {
				background: #d4d4d8;
				border-radius: 4px;
			}
			::-webkit-scrollbar-thumb:hover {
				background: #a1a1aa;
			}
			.chev {
				transition: transform 200ms ease;
			}
			details[open] > summary .chev {
				transform: rotate(0deg);
			}
			details:not([open]) > summary .chev {
				transform: rotate(-90deg);
			}
			details > summary {
				list-style: none;
				cursor: pointer;
			}
			details > summary::-webkit-details-marker {
				display: none;
			}
			details > div {
				animation: fade 200ms ease;
			}
			@keyframes fade {
				from {
					opacity: 0;
					transform: translateY(-2px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
			.shimmer {
				background: linear-gradient(
					90deg,
					transparent,
					rgba(255, 255, 255, 0.4),
					transparent
				);
				background-size: 200% 100%;
			}
		</style>
	</head>
	<body class="h-screen bg-zinc-50 text-zinc-900 antialiased">
		<div class="relative grid h-full grid-cols-[280px_minmax(0,1fr)]">
			<aside class="z-10 flex flex-col border-r border-zinc-200/80 bg-white/80 backdrop-blur">
				<div class="px-3 pt-4 pb-2">
						<label class="group flex items-center gap-2 rounded-md border border-zinc-200 bg-zinc-50/80 px-2.5 py-1.5 text-sm transition-colors focus-within:border-violet-300 focus-within:bg-white">
							<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400">
								<circle cx="11" cy="11" r="8" />
								<path d="m21 21-4.3-4.3" />
							</svg>
							<input id="search" type="text" class="w-full bg-transparent text-sm outline-none placeholder:text-zinc-400" placeholder="搜索接口" spellcheck="false" />
							<kbd class="hidden rounded border border-zinc-200 bg-white px-1.5 py-0.5 font-mono text-[10px] text-zinc-500 sm:inline-block">⌘K</kbd>
						</label>
					</div>

					<div id="tree" class="flex-1 overflow-auto px-2 pb-3"></div>

					<div class="border-t border-zinc-200/80 p-3">
						<label class="flex items-center gap-2 rounded-md border border-zinc-200 bg-white px-2.5 py-1.5 text-xs transition-colors focus-within:border-violet-300">
							<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400">
								<circle cx="12" cy="12" r="10" />
								<path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
							</svg>
							<input id="base" class="w-full bg-transparent text-xs outline-none placeholder:text-zinc-400" value="http://127.0.0.1:3001" spellcheck="false" aria-label="服务地址" />
						</label>
					</div>
				</aside>

				<main class="z-10 flex min-w-0 flex-col overflow-auto">
					<div class="px-8 pt-7">
						<div class="flex items-center gap-1.5 text-xs text-zinc-500">
							<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-400">
								<path d="M3 12h7l3 -7l4 14l3 -7h3" />
							</svg>
							<span id="breadcrumb"></span>
						</div>
						<div class="mt-1 flex items-start justify-between gap-4">
							<h1 id="title" class="text-[26px] font-semibold leading-tight tracking-tight text-zinc-900"></h1>
						</div>
					</div>

					<div class="flex-1 px-8 pb-10">
						<div class="mt-5 flex items-stretch overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]">
							<span id="method-badge" class="inline-flex min-w-[72px] items-center justify-center px-3 py-2.5 text-xs font-bold tracking-wider text-white"></span>
							<div class="flex flex-1 items-center gap-2 border-l border-zinc-200 px-3">
								<span class="truncate font-mono text-sm text-zinc-900" id="path-display"></span>
							</div>
							<button id="copy-path" class="grid place-items-center border-l border-zinc-200 px-3 text-zinc-400 transition-colors hover:bg-zinc-50 hover:text-zinc-700" type="button" aria-label="复制路径">
								<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
									<rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
									<path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
								</svg>
							</button>
							<button id="send" class="inline-flex items-center bg-gradient-to-b from-violet-500 to-violet-600 px-5 py-2.5 text-sm font-medium text-white transition-all hover:from-violet-600 hover:to-violet-700 active:translate-y-px" type="button">
								<span>发送</span>
							</button>
						</div>

						<p id="summary" class="mt-3 text-sm leading-relaxed text-zinc-600"></p>

						<h2 class="mt-8 flex items-center gap-2 text-base font-semibold tracking-tight text-zinc-900">
							<span>请求参数</span>
							<span id="param-count" class="rounded-full bg-zinc-100 px-2 py-0.5 text-[11px] font-medium text-zinc-500"></span>
						</h2>
						<div id="params-container" class="mt-3 space-y-3"></div>

						<h2 class="mt-8 text-base font-semibold tracking-tight text-zinc-900">响应</h2>
						<div class="mt-3 overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]">
							<div class="flex items-center gap-3 border-b border-zinc-200 bg-zinc-50/70 px-3 py-2 text-xs">
								<span id="status" class="font-semibold text-zinc-400">未发送</span>
								<span id="meta" class="text-zinc-500"></span>
							</div>
							<pre id="result" class="max-h-96 min-h-32 overflow-auto whitespace-pre-wrap break-words p-4 text-[12px] leading-relaxed"></pre>
						</div>

						<div id="types"></div>

						<h2 class="mt-8 text-base font-semibold tracking-tight text-zinc-900">请求示例代码</h2>
						<div class="mt-3 overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]">
							<div class="flex items-center gap-1 border-b border-zinc-200 bg-zinc-50/70 px-2 py-1.5 text-xs">
								<button data-tab="curl" class="rounded-md bg-white px-3 py-1 font-medium text-violet-700 shadow-sm" type="button">cURL</button>
								<button data-tab="js" class="rounded-md px-3 py-1 font-medium text-zinc-500 transition-colors hover:text-zinc-900" type="button">JavaScript</button>
							</div>
							<pre id="example-code" class="overflow-auto bg-zinc-950 p-4 text-[12px] leading-relaxed text-zinc-100"></pre>
						</div>
					</div>
				</main>
			</div>

			<script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
			<script>
				const SESSION_RECORD = `/** 一条会话。pi 的 SessionInfo 去掉 path、allMessagesText，时间改为 ISO 字符串，并加上内存 status。 */
type SessionRecord = {
	/** 会话 id */
	id: string
	/** 创建时的工作区绝对路径。旧会话可能是空字符串 */
	cwd: string
	/** 显示名，来自 session_info。没有时界面用 firstMessage */
	name?: string
	/** 父会话文件路径。只有 fork 出来的会话才有 */
	parentSessionPath?: string
	/** 创建时间，ISO 8601 */
	created: string
	/** 最近修改时间，ISO 8601。列表按此倒序 */
	modified: string
	/** 消息条数 */
	messageCount: number
	/** 第一条用户消息的纯文本。没有用户消息时为 "(no messages)" */
	firstMessage: string
	/** idle：未在生成。running：正在生成，自动重试等待也算 */
	status: "idle" | "running"
}`;

				const ERROR_BODY = `/** 失败时的 JSON。2xx 不返回这个形状。 */
type ErrorBody = {
	error: {
		/** BAD_REQUEST | NOT_FOUND | BUSY | INTERNAL */
		code: string
		/** 给人看的说明 */
		message: string
	}
}`;

				const ENDPOINTS = [
					{
						group: "系统",
						name: "健康检查",
						method: "GET",
						path: "/health",
						summary: "服务是否在听。返回 { \"status\": \"ok\" }。",
						auth: null,
						queryParams: [],
						bodyParams: [],
						body: "",
						requestType: `/** 无路径参数、无 query、无 body。 */
type HealthRequest = Record<string, never>`,
						responseType: `/** HTTP 200。 */
type HealthResponse = {
	/** 固定 "ok"，表示进程在听 */
	status: "ok"
}`,
					},
					{
						group: "会话",
						name: "第一次发送并创建",
						method: "POST",
						path: "/api/sessions",
						summary: "创建会话并发送第一条用户消息。第一条 user 消息发出后落盘。返回 202 与会话对象。token 走 GET /api/sessions/events。",
						queryParams: [],
						bodyParams: [
							{ name: "text", type: "string", required: true, description: "用户输入", example: "你好" },
							{ name: "cwd", type: "string", required: false, description: "工作区目录", example: "/Users/chen" },
							{ name: "thinkingLevel", type: "string", required: false, description: "思考档位。不传则新会话为 medium", example: "medium" },
						],
						body: "{\n  \"text\": \"你好\"\n}",
						requestType: `/** JSON body。 */
type CreateSessionRequest = {
	/** 第一条用户消息。必填，空字符串视为未传，400 BAD_REQUEST */
	text: string
	/** 工作区目录。不传则用用户主目录 */
	cwd?: string
	/** 思考档位。不传则新会话为 medium。不在该模型支持列表里时 400 BAD_REQUEST */
	thinkingLevel?: "off" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
}`,
						responseType: `/** HTTP 202。此时 status 为 "running"。第一条 user 消息发出后落盘。 */

${SESSION_RECORD}`,
					},
					{
						group: "会话",
						name: "列会话",
						method: "GET",
						path: "/api/sessions",
						summary: "默认全部工作区。带 cwd 时只列该工作区。",
						queryParams: [
							{ name: "cwd", type: "string", required: false, description: "工作区目录", example: "/Users/chen" },
						],
						bodyParams: [],
						body: "",
						requestType: `/** Query。无 body。 */
type ListSessionsRequest = {
	/** 工作区目录。有则只列该目录，没有则全部 */
	cwd?: string
}`,
						responseType: `${SESSION_RECORD}

/** HTTP 200。 */
type ListSessionsResponse = {
	/** 按 modified 倒序。同 id 的热会话覆盖磁盘记录 */
	sessions: SessionRecord[]
}`,
					},
					{
						group: "会话",
						name: "一条会话",
						method: "GET",
						path: "/api/sessions/:id",
						summary: "SessionInfo 推导字段加 idle|running。",
						queryParams: [],
						bodyParams: [],
						body: "",
						requestType: `/** 路径参数。无 query、无 body。 */
type GetSessionRequest = {
	/** 会话 id。找不到时 404 NOT_FOUND */
	id: string
}`,
						responseType: `/** HTTP 200。热会话用内存记录，否则读磁盘且 status 为 "idle"。 */

${SESSION_RECORD}

${ERROR_BODY}`,
					},
					{
						group: "会话",
						name: "历史",
						method: "GET",
						path: "/api/sessions/:id/history",
						summary: "SessionManager.buildSessionContext()：messages、thinkingLevel、model。",
						queryParams: [],
						bodyParams: [],
						body: "",
						requestType: `/** 路径参数。无 query、无 body。 */
type HistoryRequest = {
	/** 会话 id。找不到时 404 NOT_FOUND */
	id: string
}`,
						responseType: `/** HTTP 200。即 pi 的 SessionContext，buildSessionContext() 的返回值。 */
type HistoryResponse = {
	/** 当前叶子路径上、压缩后仍保留的消息。元素是 pi 的 AgentMessage，此处不展开联合类型 */
	messages: unknown[]
	/** 思考级别，取值以 pi 当前配置为准，如 off */
	thinkingLevel: string
	/** 当前模型。还没选定模型时为 null */
	model: {
		/** 提供商，如 minimax */
		provider: string
		/** 模型 id，如 MiniMax-M3 */
		modelId: string
	} | null
}

${ERROR_BODY}`,
					},
					{
						group: "会话",
						name: "续发",
						method: "POST",
						path: "/api/sessions/:id/prompt",
						summary: "已有会话再发一轮。正在回复且未带 streamingBehavior 则 409 BUSY。",
						queryParams: [],
						bodyParams: [
							{ name: "text", type: "string", required: true, description: "用户输入", example: "继续" },
							{ name: "streamingBehavior", type: "string", required: false, description: "正在生成时的插队方式。steer：当前回复及工具结束后、下次模型调用前插入。followUp：本轮结束后再发", example: "steer" },
							{ name: "thinkingLevel", type: "string", required: false, description: "思考档位。不传则保持会话当前档位", example: "medium" },
						],
						body: "{\n  \"text\": \"继续\"\n}",
						requestType: `/** 路径参数 + JSON body。 */
type PromptRequest = {
	/** 已有会话 id。找不到时 404 NOT_FOUND */
	id: string
	/** 本轮用户输入。必填，空字符串视为未传，400 BAD_REQUEST */
	text: string
	/** 正在生成时必填其一，否则 409 BUSY。空闲时忽略。steer：当前回复及工具结束后、下次模型调用前插入。followUp：本轮结束后再发 */
	streamingBehavior?: "steer" | "followUp"
	/** 思考档位。不传则保持会话当前档位。不在该模型支持列表里时 400 BAD_REQUEST */
	thinkingLevel?: "off" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max"
}`,
						responseType: `/** HTTP 202，status 为 "running"。正在生成且未带 streamingBehavior 时 409，code 为 BUSY。 */

${SESSION_RECORD}

${ERROR_BODY}`,
					},
					{
						group: "会话",
						name: "设置标题",
						method: "POST",
						path: "/api/sessions/:id/name",
						summary: "手动写入 name。空字符串清空。不会自动生成标题。",
						queryParams: [],
						bodyParams: [
							{ name: "name", type: "string", required: true, description: "显示名。空字符串清空", example: "修登录" },
						],
						body: "{\n  \"name\": \"修登录\"\n}",
						requestType: `/** 路径参数 + JSON body。 */
type RenameSessionRequest = {
	/** 会话 id。找不到时 404 NOT_FOUND */
	id: string
	/** 显示名。必填，可以是空字符串，表示清空 name。换行会被收成空格 */
	name: string
}`,
						responseType: `/** HTTP 200。name 为写入后的显示名；清空后该字段省略。 */

${SESSION_RECORD}

${ERROR_BODY}`,
					},
					{
						group: "模型",
						name: "思考档位",
						method: "GET",
						path: "/api/models/thinking-levels",
						summary: "按已注册模型查询可选思考档位。不打开会话。",
						queryParams: [
							{ name: "provider", type: "string", required: true, description: "提供商", example: "minimax" },
							{ name: "id", type: "string", required: true, description: "模型 id", example: "MiniMax-M3" },
						],
						bodyParams: [],
						body: "",
						requestType: `/** Query。无 body。 */
type ThinkingLevelsRequest = {
	/** 提供商。未注册时 404 NOT_FOUND */
	provider: string
	/** 模型 id。未注册时 404 NOT_FOUND */
	id: string
}`,
						responseType: `/** HTTP 200。缺 provider 或 id 时 400 BAD_REQUEST。 */
type ThinkingLevelsResponse = {
	/** 提供商 */
	provider: string
	/** 模型 id */
	id: string
	/** 新会话不传 thinkingLevel 时使用的档位 */
	defaultThinkingLevel: "medium"
	/** 该模型可选档位，顺序与 pi 的 getSupportedThinkingLevels 一致 */
	thinkingLevels: ("off" | "minimal" | "low" | "medium" | "high" | "xhigh" | "max")[]
}

${ERROR_BODY}`,
					},
					{
						group: "会话",
						name: "中止",
						method: "POST",
						path: "/api/sessions/:id/abort",
						summary: "先清空排队文本，再打断当前轮。没有生成中也成功。",
						queryParams: [],
						bodyParams: [],
						body: "",
						requestType: `/** 路径参数。无 body。 */
type AbortRequest = {
	/** 会话 id。找不到时 404 NOT_FOUND */
	id: string
}`,
						responseType: `/** HTTP 200。没有正在生成也成功，返回的 status 为 "idle"。热会话会先清空队列再中止。 */

${SESSION_RECORD}

/** 中止响应。cleared 是这次从队列里拿下来、不会再发出去的文本。 */
type AbortResponse = SessionRecord & {
	cleared: {
		/** steer 队列里被清掉的文本，按原顺序 */
		steering: string[]
		/** followUp 队列里被清掉的文本，按原顺序 */
		followUp: string[]
	}
}

${ERROR_BODY}`,
					},
					{
						group: "会话",
						name: "删除",
						method: "DELETE",
						path: "/api/sessions/:id",
						summary: "先清空队列并中止，再删除 jsonl。返回 204。",
						queryParams: [],
						bodyParams: [],
						body: "",
						requestType: `/** 路径参数。无 body。 */
type DeleteSessionRequest = {
	/** 会话 id。内存和磁盘都没有时 404 NOT_FOUND */
	id: string
}`,
						responseType: `/** HTTP 204，响应体为空。会先清空队列并中止，再删 jsonl。 */

${ERROR_BODY}`,
					},
				];

				const $ = (id) => document.querySelector(id);
				const tree = $("#tree");
				const baseInput = $("#base");
				const savedBase = localStorage.getItem("relax-api-base");
				if (savedBase) baseInput.value = savedBase;

				const METHOD_STYLE = {
					GET: { bar: "bg-emerald-500", pill: "bg-emerald-100 text-emerald-700" },
					POST: { bar: "bg-orange-500", pill: "bg-orange-100 text-orange-700" },
					PUT: { bar: "bg-blue-500", pill: "bg-blue-100 text-blue-700" },
					PATCH: { bar: "bg-pink-500", pill: "bg-pink-100 text-pink-700" },
					DELETE: { bar: "bg-red-500", pill: "bg-red-100 text-red-700" },
				};

				let activeIndex = 0;
				let activeTab = "curl";
				const collapsedGroups = new Set();

				function escapeHtml(s) {
					return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
				}

				function methodPill(method) {
					const s = METHOD_STYLE[method] ?? METHOD_STYLE.GET;
					return `<span class="inline-flex shrink-0 items-center rounded-full px-1.5 py-0.5 text-[10px] font-bold tracking-wider ${s.pill}">${method}</span>`;
				}

				function renderTree(filter = "") {
					tree.replaceChildren();
					const f = filter.trim().toLowerCase();
					const groups = new Map();
					ENDPOINTS.forEach((e, i) => {
						if (f && !e.name.toLowerCase().includes(f) && !e.path.toLowerCase().includes(f)) return;
						if (!groups.has(e.group)) groups.set(e.group, []);
						groups.get(e.group).push({ e, i });
					});

					for (const [groupName, items] of groups) {
						const isCollapsed = collapsedGroups.has(groupName);
						const head = document.createElement("button");
						head.type = "button";
						head.className = "mt-2 flex w-full items-center gap-1 px-2 pb-1 pt-2 text-xs font-medium text-zinc-500 transition-colors hover:text-zinc-900 first:mt-0";
						head.innerHTML = `<svg class="chev" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate(${isCollapsed ? "-90deg" : "0deg"})"><polyline points="6 9 12 15 18 9"/></svg><span class="truncate">${escapeHtml(groupName)}</span>`;
						head.addEventListener("click", () => {
							if (collapsedGroups.has(groupName)) collapsedGroups.delete(groupName);
							else collapsedGroups.add(groupName);
							renderTree(filter);
						});
						tree.append(head);

						if (isCollapsed) continue;
						for (const { e, i } of items) {
							const btn = document.createElement("button");
							btn.type = "button";
							btn.dataset.index = String(i);
							const active = i === activeIndex;
							btn.className = `flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left text-sm transition-colors ${active ? "bg-violet-100 font-medium text-violet-900" : "text-zinc-700 hover:bg-zinc-100"}`;
							btn.innerHTML = `<span class="flex-1 truncate">${escapeHtml(e.name)}</span>${methodPill(e.method)}`;
							btn.addEventListener("click", () => {
								activeIndex = i;
								select();
							});
							tree.append(btn);
						}
					}

					if (!groups.size) {
						const empty = document.createElement("div");
						empty.className = "px-3 py-8 text-center text-xs text-zinc-400";
						empty.textContent = "没有匹配的接口";
						tree.append(empty);
					}
				}

				function authCard(endpoint) {
					const body = endpoint.auth
						? `<div class="border-t border-zinc-200 px-4 py-3 space-y-1.5 text-xs">
								<div class="text-sm font-semibold text-zinc-900">${escapeHtml(endpoint.auth)}</div>
								<div class="text-zinc-500">在 Header 添加参数 <code class="rounded bg-violet-50 px-1.5 py-0.5 text-violet-700">Authorization</code></div>
								<div class="flex items-center gap-2 text-zinc-500">
									<span>示例:</span>
									<code class="rounded bg-zinc-100 px-1.5 py-0.5 text-zinc-700">Authorization: ************************</code>
								</div>
							</div>`
						: `<div class="border-t border-zinc-200 px-4 py-3 text-xs text-zinc-500">无需鉴权</div>`;
					return `<details class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]" open>
							<summary class="flex items-center gap-2 px-4 py-3 text-sm font-medium hover:bg-zinc-50">
								<svg class="chev text-zinc-400" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
								<span>Authorization</span>
							</summary>
							${body}
						</details>`;
				}

				const pathValues = {};
				const queryValues = {};

				function pathParamNames(path) {
					return [...path.matchAll(/:([A-Za-z_][\w]*)/g)].map((match) => match[1]);
				}

				function pathKey(endpoint, name) {
					return `${endpoint.path}\0${name}`;
				}

				function pathParamList(endpoint) {
					const described = new Map((endpoint.pathParams ?? []).map((item) => [item.name, item]));
					return pathParamNames(endpoint.path).map((name) => {
						const meta = described.get(name) ?? {};
						return {
							name,
							type: meta.type ?? "string",
							description: meta.description ?? `替换路径中的 :${name}`,
							example: meta.example ?? "",
						};
					});
				}

				function filledPath(endpoint, encode) {
					return endpoint.path.replace(/:([A-Za-z_][\w]*)/g, (_, name) => {
						const value = (pathValues[pathKey(endpoint, name)] ?? "").trim();
						if (!value) return `:${name}`;
						return encode ? encodeURIComponent(value) : value;
					});
				}

				function missingPathParams(endpoint) {
					return pathParamNames(endpoint.path).filter((name) => !(pathValues[pathKey(endpoint, name)] ?? "").trim());
				}

				function pathCard(endpoint) {
					const list = pathParamList(endpoint);
					const body = list.length
						? `<div class="border-t border-zinc-200">
								${list
									.map(
										(p) => `<div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-1 border-b border-zinc-100 px-4 py-3 last:border-b-0">
										<div class="flex items-center gap-2 min-w-0">
											<span class="shrink-0 rounded bg-violet-50 px-2 py-0.5 font-mono text-xs font-medium text-violet-700">${escapeHtml(p.name)}</span>
											<span class="font-mono text-xs text-zinc-500">${escapeHtml(p.type)}</span>
											<span class="text-[10px] font-semibold text-red-500">必填</span>
										</div>
										<div class="text-xs text-zinc-400">必填</div>
										<div class="col-span-2 text-xs text-zinc-500">${escapeHtml(p.description)}</div>
										<input data-path-param="${escapeHtml(p.name)}" value="${escapeHtml(pathValues[pathKey(endpoint, p.name)] ?? "")}" placeholder="${escapeHtml(p.example || p.name)}" class="col-span-2 mt-1 w-full rounded-md border border-zinc-200 bg-zinc-50 px-3 py-2 font-mono text-[12px] outline-none focus:border-violet-300 focus:bg-white" spellcheck="false" />
									</div>`,
									)
									.join("")}
							</div>`
						: `<div class="border-t border-zinc-200 px-4 py-3 text-xs text-zinc-500">无</div>`;
					return `<details class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]" open>
							<summary class="flex items-center gap-2 px-4 py-3 text-sm font-medium hover:bg-zinc-50">
								<svg class="chev text-zinc-400" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
								<span>路径参数</span>
								${list.length ? `<span class="rounded-full bg-zinc-100 px-2 py-0.5 text-[10px] font-medium text-zinc-500">${list.length}</span>` : ""}
							</summary>
							${body}
						</details>`;
				}

				function queryKey(endpoint, name) {
					return `${endpoint.path}\0${name}`;
				}

				function queryValue(endpoint, param) {
					const key = queryKey(endpoint, param.name);
					if (Object.prototype.hasOwnProperty.call(queryValues, key)) return queryValues[key];
					return param.required ? param.example ?? "" : "";
				}

				function queryString(endpoint) {
					const parts = [];
					for (const param of endpoint.queryParams ?? []) {
						const value = queryValue(endpoint, param).trim();
						if (!value) continue;
						parts.push(`${encodeURIComponent(param.name)}=${encodeURIComponent(value)}`);
					}
					return parts.length ? `?${parts.join("&")}` : "";
				}

				function missingQueryParams(endpoint) {
					return (endpoint.queryParams ?? [])
						.filter((param) => param.required && !queryValue(endpoint, param).trim())
						.map((param) => param.name);
				}

				function requestPath(endpoint, encode) {
					return filledPath(endpoint, encode) + queryString(endpoint);
				}

				function queryCard(endpoint) {
					const list = endpoint.queryParams ?? [];
					const body = list.length
						? `<div class="border-t border-zinc-200">
								${list
									.map(
										(p) => `<div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-1 border-b border-zinc-100 px-4 py-3 last:border-b-0">
										<div class="flex items-center gap-2 min-w-0">
											<span class="shrink-0 rounded bg-violet-50 px-2 py-0.5 font-mono text-xs font-medium text-violet-700">${escapeHtml(p.name)}</span>
											<span class="font-mono text-xs text-zinc-500">${escapeHtml(p.type)}</span>
											${p.required ? '<span class="text-[10px] font-semibold text-red-500">必填</span>' : ""}
										</div>
										<div class="text-xs text-zinc-400">${p.required ? "必填" : "可选"}</div>
										${p.description ? `<div class="col-span-2 text-xs text-zinc-500">${escapeHtml(p.description)}</div>` : ""}
										<input data-query-param="${escapeHtml(p.name)}" value="${escapeHtml(queryValue(endpoint, p))}" placeholder="${escapeHtml(p.example || p.name)}" class="col-span-2 mt-1 w-full rounded-md border border-zinc-200 bg-zinc-50 px-3 py-2 font-mono text-[12px] outline-none focus:border-violet-300 focus:bg-white" spellcheck="false" />
									</div>`,
									)
									.join("")}
							</div>`
						: `<div class="border-t border-zinc-200 px-4 py-3 text-xs text-zinc-500">无</div>`;
					return `<details class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]" open>
							<summary class="flex items-center gap-2 px-4 py-3 text-sm font-medium hover:bg-zinc-50">
								<svg class="chev text-zinc-400" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
								<span>Query 参数</span>
								${list.length ? `<span class="rounded-full bg-zinc-100 px-2 py-0.5 text-[10px] font-medium text-zinc-500">${list.length}</span>` : ""}
							</summary>
							${body}
						</details>`;
				}

				function bodyCard(endpoint) {
					const list = endpoint.bodyParams ?? [];
					const canHaveBody = !["GET", "HEAD"].includes(endpoint.method);
					const templateBody = (endpoint.body || "").trim();
					const initBody =
						templateBody ||
						(list.length
							? JSON.stringify(
									Object.fromEntries(
										list.map((p) => [p.name, p.example ?? defaultForType(p.type)]),
									),
									null,
									2,
								)
							: "");
					const body = canHaveBody
						? `<div class="border-t border-zinc-200 px-4 py-3">
								<textarea id="body-input" class="w-full resize-y rounded-md border border-zinc-200 bg-zinc-50 p-3 font-mono text-[12px] outline-none focus:border-violet-300 focus:bg-white" rows="6" spellcheck="false" placeholder='{"key": "value"}'>${escapeHtml(initBody)}</textarea>
							</div>`
						: `<div class="border-t border-zinc-200 px-4 py-3 text-xs text-zinc-500">${endpoint.method} 请求无需请求体</div>`;
					return `<details class="overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]" open>
							<summary class="flex items-center gap-2 px-4 py-3 text-sm font-medium hover:bg-zinc-50">
								<svg class="chev text-zinc-400" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
								<span>Body 参数</span>
								${list.length ? `<span class="rounded-full bg-zinc-100 px-2 py-0.5 text-[10px] font-medium text-zinc-500">${list.length}</span>` : ""}
							</summary>
							${body}
						</details>`;
				}

				function defaultForType(type) {
					if (type === "string") return "";
					if (type === "number") return 0;
					if (type === "boolean") return false;
					if (type === "array") return [];
					if (type === "object") return {};
					return null;
				}

				function typeSection(title, code) {
					const text = (code || "").trim();
					const body = text
						? `<pre class="overflow-auto bg-zinc-950 p-4 text-[12px] leading-relaxed text-zinc-100">${escapeHtml(text)}</pre>`
						: `<div class="bg-zinc-950 px-4 py-3 text-xs text-zinc-500">无</div>`;
					return `<section class="mt-8">
						<h2 class="text-base font-semibold tracking-tight text-zinc-900">${title}</h2>
						<div class="mt-3 overflow-hidden rounded-lg border border-zinc-200 bg-white shadow-[0_1px_2px_rgba(0,0,0,0.04)]">${body}</div>
					</section>`;
				}

				function renderTypes(endpoint) {
					$("#types").innerHTML =
						typeSection("请求类型", endpoint.requestType) +
						typeSection("返回类型", endpoint.responseType);
				}

				function renderParams(endpoint) {
					const c = $("#params-container");
					c.innerHTML = authCard(endpoint) + pathCard(endpoint) + queryCard(endpoint) + bodyCard(endpoint);
					const total =
						(endpoint.auth ? 1 : 0) +
						pathParamList(endpoint).length +
						(endpoint.queryParams?.length ?? 0) +
						(endpoint.bodyParams?.length ?? 0);
					$("#param-count").textContent = total ? `${total} 个参数` : "";
					const refreshPath = () => {
						$("#path-display").textContent = requestPath(endpoint, false);
						renderExample(endpoint);
					};
					for (const input of c.querySelectorAll("[data-path-param]")) {
						input.addEventListener("input", () => {
							pathValues[pathKey(endpoint, input.dataset.pathParam)] = input.value;
							refreshPath();
						});
					}
					for (const input of c.querySelectorAll("[data-query-param]")) {
						input.addEventListener("input", () => {
							queryValues[queryKey(endpoint, input.dataset.queryParam)] = input.value;
							refreshPath();
						});
					}
				}

				function buildCurl(endpoint, base) {
					let url = base + requestPath(endpoint, true);
					const lines = [`curl -X ${endpoint.method} '${url}'`];
					if (endpoint.auth) lines.push(`  -H 'Authorization: Bearer YOUR_TOKEN'`);
					const body = ($("#body-input")?.value || "").trim();
					if (body && !["GET", "HEAD"].includes(endpoint.method)) {
						lines.push(`  -H 'Content-Type: application/json'`);
						lines.push(`  -d '${body.replace(/'/g, "'\\''")}'`);
					}
					return lines.join(" \\\n");
				}

				function buildJs(endpoint, base) {
					let url = base + requestPath(endpoint, true);
					const opts = [`  method: '${endpoint.method}'`];
					if (endpoint.auth) opts.push(`  headers: { 'Authorization': 'Bearer YOUR_TOKEN' }`);
					const body = ($("#body-input")?.value || "").trim();
					if (body && !["GET", "HEAD"].includes(endpoint.method)) {
						opts.push(`  body: ${body.replace(/\n/g, " ")}`);
					}
					return `await fetch(${JSON.stringify(url)}, {\n${opts.join(",\n")}\n}).then(r => r.json())`;
				}

				function renderExample(endpoint) {
					const base = baseInput.value.trim().replace(/\/$/, "");
					$("#example-code").textContent = activeTab === "curl" ? buildCurl(endpoint, base) : buildJs(endpoint, base);
				}

				function select() {
					const endpoint = ENDPOINTS[activeIndex];
					$("#title").textContent = endpoint.name;
					$("#breadcrumb").textContent = endpoint.group;
					$("#summary").textContent = endpoint.summary;
					$("#path-display").textContent = requestPath(endpoint, false);
					const s = METHOD_STYLE[endpoint.method] ?? METHOD_STYLE.GET;
					const badge = $("#method-badge");
					badge.textContent = endpoint.method;
					badge.className = `inline-flex min-w-[72px] items-center justify-center px-3 py-2.5 text-xs font-bold tracking-wider text-white ${s.bar}`;
					renderTree($("#search").value);
					renderParams(endpoint);
					renderTypes(endpoint);
					renderExample(endpoint);
				}

				$("#search").addEventListener("input", (e) => renderTree(e.target.value));

				for (const tab of document.querySelectorAll("[data-tab]")) {
					tab.addEventListener("click", () => {
						activeTab = tab.dataset.tab;
						for (const t of document.querySelectorAll("[data-tab]")) {
							const active = t === tab;
							t.className = active
								? "rounded-md bg-white px-3 py-1 font-medium text-violet-700 shadow-sm"
								: "rounded-md px-3 py-1 font-medium text-zinc-500 transition-colors hover:text-zinc-900";
						}
						renderExample(ENDPOINTS[activeIndex]);
					});
				}

				const flash = (btn, text) => {
					const orig = btn.innerHTML;
					btn.innerHTML = text;
					setTimeout(() => (btn.innerHTML = orig), 1200);
				};

				$("#copy-path").addEventListener("click", () => {
					navigator.clipboard?.writeText(requestPath(ENDPOINTS[activeIndex], false));
					flash($("#copy-path"), '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>');
				});

				baseInput.addEventListener("input", () => {
					localStorage.setItem("relax-api-base", baseInput.value.trim());
					renderExample(ENDPOINTS[activeIndex]);
				});

				async function run() {
					const base = baseInput.value.trim().replace(/\/$/, "");
					localStorage.setItem("relax-api-base", base);
					const endpoint = ENDPOINTS[activeIndex];
					const method = endpoint.method;
					const missing = [...missingPathParams(endpoint), ...missingQueryParams(endpoint)];
					if (missing.length) {
						$("#status").textContent = "未发送";
						$("#status").className = "font-semibold text-zinc-400";
						$("#meta").textContent = "";
						$("#result").textContent = `先填写参数：${missing.join("、")}`;
						return;
					}
					const raw = ($("#body-input")?.value || "").trim();
					$("#send").disabled = true;
					$("#status").textContent = "发送中…";
					$("#status").className = "font-semibold text-zinc-400";
					$("#meta").textContent = "";
					$("#result").textContent = "";
					const started = performance.now();
					try {
						const response = await axios({
							method,
							url: base + requestPath(endpoint, true),
							data: raw && !["GET", "HEAD"].includes(method) ? JSON.parse(raw) : undefined,
							validateStatus: () => true,
						});
						const ms = Math.round(performance.now() - started);
						const ok = response.status >= 200 && response.status < 300;
						$("#status").textContent = `${response.status} ${response.statusText || ""}`;
						$("#status").className = ok ? "font-semibold text-emerald-600" : "font-semibold text-red-600";
						$("#meta").textContent = `${ms} ms · ${response.headers?.["content-type"] ?? ""}`;
						$("#result").textContent =
							typeof response.data === "string" ? response.data : JSON.stringify(response.data, null, 2);
					} catch (error) {
						$("#status").textContent = "失败";
						$("#status").className = "font-semibold text-red-600";
						$("#meta").textContent = "确认 pnpm dev:server 已在该地址监听";
						$("#result").textContent = error instanceof SyntaxError ? "请求体不是合法 JSON" : String(error);
					} finally {
						$("#send").disabled = false;
					}
				}

				$("#send").addEventListener("click", run);
				document.addEventListener("keydown", (event) => {
					if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
						event.preventDefault();
						run();
					}
					if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
						const tag = document.activeElement?.tagName?.toLowerCase();
						if (tag !== "input" && tag !== "textarea") {
							event.preventDefault();
							$("#search").focus();
							$("#search").select();
						}
					}
				});

				renderTree();
				select();
			</script>
		</body>
	</html>
