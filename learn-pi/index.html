<style>

  th, td { text-align: left; padding: 8px 12px; border: 1px solid var(--border-soft); vertical-align: top; }

  /* timeline */

    padding: 14px 16px;
    margin: 10px 0 14px;

    font-size: 12.5px;
  }
  .flow-children {
    margin-left: 14px;
    padding-left: 14px;
    border-left: 1px dashed var(--border);
  }
  .flow-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    margin: 4px 0;
    background: var(--bg-3);
    border: 1px solid var(--border-soft);
    border-left-width: 3px;
    border-radius: 4px;
    white-space: nowrap;
    color: var(--text);

  .flow-row .cnt {
    color: var(--text-dim);

    border: 1px solid var(--border);

  .flow-row .note {
    color: var(--text-dim);

  .flow-row.cat-agent { border-left-color: var(--ok-border); }
  .flow-row.cat-turn  { border-left-color: var(--ok-border); }
  .flow-row.cat-msg   { border-left-color: var(--accent); }
  .flow-row.cat-tool  { border-left-color: var(--warn-border); }
  .flow-row.cat-loop  {

    border: 1px dashed var(--border);

    font-style: italic;
  }
  .flow-row.cat-loop .cnt { display: none; }
  .flow-section-title {
    margin: 14px 0 8px;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .flow-inter {
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--bg-2);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
  }
  .flow-inter h5 {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .flow-inter .group { margin-bottom: 10px; }
  .flow-inter .group:last-child { margin-bottom: 0; }
  .flow-inter .glabel {
    font-size: 11.5px; color: var(--text-dim);
    margin-bottom: 4px; font-family: var(--sans);
  }
  .flow-inter .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .flow-inter .chip {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 3px 9px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text-muted);
  }
  .flow-inter .chip .cnt {
    color: var(--text-dim);
    margin-left: 6px;
    font-size: 10.5px;
  }
  .flow-inter .chips.cat-compact .chip { border-left: 2px solid var(--warn-border); }
  .flow-inter .chips.cat-retry .chip    { border-left: 2px solid var(--warn-border); }
  .flow-inter .chips.cat-state .chip    { border-left: 2px solid var(--accent); }

  .pitfall {
    border-left: 3px solid var(--warn-border);
    background: var(--warn-bg);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    margin: 10px 0;
    font-size: 13px;
    color: var(--text-muted);
  }
  .pitfall strong { color: var(--text); }
  .pitfall code { background: rgba(255,255,255,0.05); }
</style>

<script>
  // ========== 数据：每块一个 topic，添加新内容就在这里 append ==========
  const topics = [
    {
      id: "topic-1",
      tag: "01",
      title: "SDK 接入的工厂 API 分层",
      group: "SDK 接入",
      html: `
        <div class="page-header">
          <h2>pi SDK 学习笔记</h2>
          <p class="subtitle">基于 <code>pi/</code> 源码实证 · 多块内容持续更新</p>
        </div>

        <div class="qa">
          <div class="qa-q"><span class="badge">Q</span><p><code>createAgentSession</code> 和运行时版本的区别？还有什么类似的 API？</p></div>
          <div class="qa-a">
            <p>SDK 工厂分四层，从下到上叠加，全部位于 <code>packages/coding-agent/src/core/</code>。上层只是把下层的拼装延后/外露，没有第五个并列工厂。</p>
            <table>
              <thead><tr><th>层</th><th>函数</th><th>产物</th><th>用途</th></tr></thead>
              <tbody>
                <tr><td>1</td><td><code>createAgentSession()</code></td><td><code>{ session, extensionsResult, modelFallbackMessage? }</code></td><td>一次性建单个 AgentSession</td></tr>
                <tr><td>2</td><td><code>createAgentSessionServices()</code></td><td><code>AgentSessionServices</code>（只服务，不建 session）</td><td>先拿到 cwd 绑定的资源再选 model/tools</td></tr>
                <tr><td>3</td><td><code>createAgentSessionFromServices()</code></td><td>同 Layer 1</td><td>组合 Layer 2 + 会话级参数</td></tr>
                <tr><td>4</td><td><code>createAgentSessionRuntime(factory, opts)</code> → <code>AgentSessionRuntime</code></td><td>运行时句柄</td><td>支持 newSession / switchSession / fork / importFromJsonl</td></tr>
              </tbody>
            </table>
            <div class="callout"><strong>选型</strong>：单次脚本用 Layer 1；想自定义 UI 接管多会话生命周期用 Layer 4。需要 JSON-RPC 子进程再加 <code>runRpcMode(AgentSessionRuntime)</code>（Layer 5）。</div>
            <div class="src">源码：core/sdk.ts:173 · core/agent-session-services.ts:135 · core/agent-session-services.ts:202 · core/agent-session-runtime.ts:422 · modes/rpc/rpc-mode.ts:54</div>
          </div>
        </div>
      `
    },
    {
      id: "topic-2",
      tag: "02",
      title: "自定义 UI 的多会话切换",
      group: "SDK 接入",
      html: `
        <div class="qa">
          <div class="qa-q"><span class="badge">Q</span><p>如果想做一个支持多会话切换的自定义页面，应该选哪个 API？</p></div>
          <div class="qa-a">
            <p>用 <code>createAgentSessionRuntime()</code> + <code>AgentSessionRuntime</code>。</p>
            <p>文档原话（<code>docs/sdk.md:146-147</code>）：「Session replacement APIs such as new-session, resume, fork, and import live on <code>AgentSessionRuntime</code>, not on <code>AgentSession</code>.」</p>
            <p>替换 API 列表（<code>core/agent-session-runtime.ts</code>）：</p>
            <ul class="tight">
              <li><code>newSession(options?)</code> — 第 226 行</li>
              <li><code>switchSession(path, options?)</code> — 第 196 行</li>
              <li><code>fork(entryId, { position? })</code> — 第 262 行</li>
              <li><code>importFromJsonl(inputPath, cwdOverride?)</code> — 第 361 行</li>
              <li><code>dispose()</code> — 第 406 行</li>
            </ul>
            <div class="callout warn">
              <strong>三条关键约束</strong>（<code>docs/sdk.md:200-211</code>）：
              <ol style="margin:6px 0 0;padding-left:20px;">
                <li>替换后 <code>runtime.session</code> 实例变了；订阅和 <code>bindExtensions</code> 必须重新挂到新 session。</li>
                <li>诊断信息走 <code>runtime.diagnostics</code>，不直接打印。</li>
                <li>替换失败抛异常，由调用方决定怎么处理。</li>
              </ol>
            </div>
<pre><code>const factory = async ({ cwd, sessionManager, sessionStartEvent }) =&gt; {
  const services = await createAgentSessionServices({ cwd });
  return {
    ...(await createAgentSessionFromServices({ services, sessionManager, sessionStartEvent })),
    services,
    diagnostics: services.diagnostics,
  };
};

const runtime = await createAgentSessionRuntime(factory, {
  cwd: process.cwd(),
  agentDir: getAgentDir(),
  sessionManager: SessionManager.create(process.cwd()),
});

// 切换后必须 rebind
let unsubscribe;
const bind = async () =&gt; {
  unsubscribe?.();
  await runtime.session.bindExtensions({});
  unsubscribe = runtime.session.subscribe((e) =&gt; { /* ... */ });
};
await bind();
await runtime.newSession();
await bind();</code></pre>
            <div class="src">参考：examples/sdk/13-session-runtime.ts</div>
          </div>
        </div>
      `
    },
    {
      id: "topic-3",
      tag: "03",
      title: "同时在两个项目目录里跑对话",
      group: "SDK 接入",
      html: `
        <div class="qa">
          <div class="qa-q"><span class="badge">Q</span><p>需要同时在两个不同 cwd 进行对话，一个 runtime 行不行？</p></div>
          <div class="qa-a">
            <p>不行。一个 <code>AgentSessionRuntime</code> = 一个 cwd。它的 <code>cwd</code> 是常量（<code>agent-session-runtime.ts:105-107</code>），切 cwd 等于销毁旧 runtime、建新的。</p>
            <p><strong>正解：建两个 runtime 实例。</strong>所有相关状态都是实例级，没有全局单例：</p>
            <ul class="tight">
              <li><code>ModelRuntime</code>（<code>core/model-runtime.ts:130</code>）所有可变字段都是实例字段，多实例互不影响。</li>
              <li><code>SettingsManager</code> 按 cwd 构造，天然隔离。</li>
              <li>Session 文件落点：<code>~/.pi/agent/sessions/--&lt;safeCwd&gt;--/</code>（<code>session-manager.ts:476-489</code>），目录互不重叠。</li>
              <li>Session ID = <code>uuidv7()</code>（<code>session-manager.ts:208</code>），全局唯一。</li>
              <li>Bash 工具的 <code>PI_SESSION_ID</code> 是 per-spawn env 拷贝（<code>tools/bash.ts:172-188</code>），不污染 <code>process.env</code>。</li>
              <li>全文无 <code>static instance / getInstance / shared / singleton</code> 模式。</li>
              <li><code>agent/docs/harness.md:31</code> 明说：「The same receiver may serve concurrent local callers or RPC clients」。</li>
            </ul>
            <div class="callout"><strong>唯一一处进程全局副作用</strong>：<code>core/sdk.ts:37</code> 的 <code>setDefaultStreamFn(streamSimple)</code> 模块加载时跑一次，给「没传 streamFn 的扩展」用；自己建的 <code>Agent</code> 总是显式传 streamFn（<code>sdk.ts:314</code>），不受影响。</div>
            <p>基础用法：</p>
<pre><code>const make = (cwd) =&gt; async ({ sessionManager, sessionStartEvent }) =&gt; {
  const services = await createAgentSessionServices({ cwd });
  return {
    ...(await createAgentSessionFromServices({ services, sessionManager, sessionStartEvent })),
    services,
    diagnostics: services.diagnostics,
  };
};

const [rA, rB] = await Promise.all([
  createAgentSessionRuntime(make("/projA"), { cwd: "/projA", agentDir, sessionManager: SessionManager.create("/projA") }),
  createAgentSessionRuntime(make("/projB"), { cwd: "/projB", agentDir, sessionManager: SessionManager.create("/projB") }),
]);

await Promise.all([
  rA.session.prompt("..."),
  rB.session.prompt("..."),
]);</code></pre>
            <p>可选优化：<code>ModelRuntime</code> 可共享，省一次启动开销。</p>
<pre><code>const sharedModelRuntime = await ModelRuntime.create();
const make = (cwd) =&gt; async (opts) =&gt; {
  const services = await createAgentSessionServices({ cwd, modelRuntime: sharedModelRuntime });

            <h4 style="font-size:14px;margin:14px 0 10px;color:var(--text);">3. 构建 active 分支的算法（<code>buildContextEntries</code>，<code>session-manager.ts:418-454</code>）</h4>
<pre><code>function buildContextEntries(entries, leafId, byId) {
  // 1. 从 leafId 走到 root，拿到完整路径
  const path = buildSessionPath(entries, leafId, byId);  // 反向遍历 parentId

  // 2. 找路径上最近的 compaction（一般就一个）
  let compaction = null;
  for (const entry of path) {
    if (entry.type === "compaction") compaction = entry;
  }
  if (!compaction) return path;

  // 3. 组装最终 context：
  //    [compaction 本身, ...firstKeptEntryId 之后的 entry, ...compaction 之后的 entry]
  const compactionIdx = path.findIndex(e =&gt; e.id === compaction.id);
  const result = [compaction];
  let foundFirstKept = false;
  for (let i = 0; i &lt; compactionIdx; i++) {
    if (path[i].id === compaction.firstKeptEntryId) foundFirstKept = true;
    if (foundFirstKept) result.push(path[i]);
  }
  result.push(...path.slice(compactionIdx + 1));  // compaction 之后的所有 entry
  return result;
}</code></pre>

            <p>内部走 <code>buildSessionPath</code>（<code>session-manager.ts:334-360</code>）——从 leaf 一路顺着 parentId 走到 root，<strong>reverse</strong> 一下就是 root→leaf 顺序：</p>
<pre><code>function buildSessionPath(entries, leafId, byId) {
  const index = byId ?? buildEntryIndex(entries);
  let current = index.get(leafId);            // a6
  const path = [];
  while (current) {
    path.push(current);                       // [a6, a5, a4, a3, a2, a1]
    current = current.parentId ? index.get(current.parentId) : undefined;
  }
  path.reverse();                             // [a1, a2, a3, a4, a5, a6]
  return path;
}</code></pre>

            <p>无 compaction → 路径直接当 context，再 <code>sessionEntryToContextMessages</code>（<code>session-manager.ts:383-413</code>）转成 AgentMessage 数组。过滤规则：</p>
            <ul class="tight">
              <li><code>message</code> → 原 message</li>
              <li><code>compaction</code> → compactionSummary</li>
              <li><code>branch_summary</code> → branchSummary</li>
              <li><code>custom_message</code> → CustomMessage</li>
              <li><code>model_change</code> / <code>thinking_level_change</code> → 不进 messages，但 <code>getSessionContextSettings</code> 提取 model + thinkingLevel 字段</li>
              <li><code>custom</code> / <code>label</code> / <code>session_info</code> → 完全不进 context</li>
            </ul>

            <h4 style="font-size:14px;margin:14px 0 8px;color:var(--text);">4. 关键字段 firstKeptEntryId = a4</h4>
            <p>含义：「压缩点 a1/a2/a3 那些旧消息会被摘要替代，<strong>从 a4 开始保留原文</strong>」。SessionManager 决定 firstKeptEntryId 的算法（<code>compaction/compaction.ts</code>）：</p>
            <ul class="tight">
              <li>找到路径上一个合适的「切割点」（通常选最近的 assistant 消息，保证对话结构完整）</li>
              <li>把切割点之前的全部 entry ID 作为 <code>firstKeptEntryId</code>（实际只存这一个，build 时用它往后扫）</li>
              <li>让 LLM 摘要切割点之前的内容</li>
            </ul>

            <h4 style="font-size:14px;margin:14px 0 8px;color:var(--text);">5. buildContextEntries 的折叠算法</h4>
<pre><code>function buildContextEntries(entries, leafId, byId) {
  // Step 1: leaf 沿 parentId 走到 root，反转得到 root→leaf 完整路径
  const path = buildSessionPath(entries, leafId, byId);
  // path = [a1, a2, a3, a4, a5, a6, b1, b2]

  // Step 2: 路径上找最近的 compaction（一般 1 个，多次压缩就找最后那个）
  let compaction = null;
  for (const e of path) {
    if (e.type === "compaction") compaction = e;   // 找到 b1
  }
  if (!compaction) return path;

  // Step 3: 重新组装
  const compactionIdx = path.findIndex(e =&gt; e.id === compaction.id);  // 6
  const result = [compaction];                  // ① compaction 本身放最前
  let foundFirstKept = false;
  for (let i = 0; i &lt; compactionIdx; i++) {
    if (path[i].id === compaction.firstKeptEntryId) foundFirstKept = true;   // i=3 时碰到 a4
    if (foundFirstKept) result.push(path[i]);      // ② 从 firstKeptEntryId 开始保留到 compaction 之前
  }
  // result = [b1, a4, a5, a6]
  result.push(...path.slice(compactionIdx + 1));  // ③ compaction 之后的所有 entry
  // result = [b1, a4, a5, a6, b2]

  return result;
}</code></pre>

  // ========== 路由 ==========
  const groups = [...new Set(topics.map(t => t.group))];

  function renderNav(activeId) {
    const nav = document.getElementById('nav');
    nav.innerHTML = groups.map(g => `
      <div class="nav-group">
        <div class="nav-group-title">${g}</div>
        ${topics.filter(t => t.group === g).map(t => {
          if (t.disabled) return `<a class="disabled">${t.tag} · ${t.title}</a>`;
          const cls = t.id === activeId ? 'active' : '';
          return `<a href="#/${t.id}" class="${cls}" data-id="${t.id}">${t.tag} · ${t.title}</a>`;
        }).join('')}
      </div>
    `).join('');
  }

  function renderView(id) {
    const view = document.getElementById('view');
    const t = topics.find(x => x.id === id) || topics[0];
    const idx = topics.findIndex(x => x.id === t.id);
    const prev = idx > 0 ? topics[idx - 1] : null;
    const next = idx < topics.length - 1 ? topics[idx + 1] : null;
    view.innerHTML = `
      <section class="topic">
        <div class="topic-head">
          <span class="topic-tag">${t.tag}</span>
          <h3>${t.title}</h3>
        </div>
        ${t.html}
        <div class="pager">
          ${prev ? `<a href="#/${prev.id}"><span class="label">← 上一块</span><span class="title">${prev.tag} · ${prev.title}</span></a>` : `<span class="placeholder"></span>`}
          ${next ? `<a class="next" href="#/${next.id}"><span class="label">下一块 →</span><span class="title">${next.tag} · ${next.title}</span></a>` : `<span class="placeholder"></span>`}
        </div>
      </section>
    `;
  }

  function parseRoute() {
    const h = location.hash.replace(/^#\/?/, '');
    return h || topics[0].id;
  }

  function route() {
    const id = parseRoute();
    renderNav(id);
    renderView(id);
    document.title = `${id} · learn-pi`;
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', route);
  if (document.readyState !== 'loading') route();
</script>
