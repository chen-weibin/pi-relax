<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --app: #171717;
      --sidebar: #1e1e1e;
      --surface-hover: #292929;
      --surface-active: #2e2e2e;
      --fg: #e5e5e5;
      --fg-bright: #f5f5f5;
      --fg-2: #c7c7c7;
      --fg-3: #a1a1a1;
      --border: #2a2a2a;
    }

    html, body {
      height: 100%;
      background: var(--app);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 14px;
    }

    .layout {
      display: flex;
      height: 100vh;
    }

    nav {
      width: 200px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    nav h1 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--fg-3);
      text-transform: uppercase;
      padding: 0 8px;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    nav a {
      display: block;
      padding: 7px 10px;
      border-radius: 6px;
      color: var(--fg-2);
      text-decoration: none;
      font-size: 13px;
      transition: background-color 120ms ease, color 120ms ease;
    }

    nav a:hover {
      background: var(--surface-hover);
      color: var(--fg-bright);
    }

    nav a.active {
      background: var(--surface-active);
      color: var(--fg-bright);
    }

    .nav-meta {
      margin-top: auto;
      padding: 0 8px;
      font-size: 11px;
      color: #555;
      font-family: "SF Mono", Menlo, monospace;
      letter-spacing: 0.3px;
      line-height: 1.6;
    }

    main {
      flex: 1;
      min-width: 0;
      display: flex;
    }

    iframe {
      flex: 1;
      border: 0;
      background: var(--app);
    }
  </style>
</head>
<body>
  <div class="layout">
    <nav>
      <h1>Playground</h1>
      <ul id="nav-list"></ul>
      <div class="nav-meta">写进 app/web/src/<br>之前的预览沙盒</div>
    </nav>
    <main>
      <iframe id="viewer" title="Demo"></iframe>
    </main>
  </div>
  <script>
    const DEMOS = [
      { slug: 'status-dot',   label: '状态点 StatusDot', file: 'demos/status-dot-demo.html' },
      { slug: 'loading-dots', label: 'LoadingDots',      file: 'demos/typing-dots-demo.html' },
      { slug: 'spinner',      label: '圆圈 Spinner',     file: 'demos/spinner-demo.html' },
      { slug: 'theme-colors',  label: '主题色',           file: 'demos/theme-colors.html' },
      { slug: 'dot-matrix',   label: '点阵 DotMatrix',   file: 'demos/dot-matrix-demo.html' },
      { slug: 'avatar1',     label: '动态头像1',        file: 'demos/avatar-demo1.html' },
      { slug: 'avatar2',     label: '动态头像2',        file: 'demos/avatar-demo2.html' },
    ]

    const list = document.getElementById('nav-list')
    const viewer = document.getElementById('viewer')

    for (const d of DEMOS) {
      const li = document.createElement('li')
      const a = document.createElement('a')
      a.href = '#' + d.slug
      a.textContent = d.label
      a.dataset.slug = d.slug
      li.appendChild(a)
      list.appendChild(li)
    }

    const links = list.querySelectorAll('a')

    function load(slug) {
      const demo = DEMOS.find(d => d.slug === slug) || DEMOS[0]
      viewer.src = demo.file
      links.forEach(l => l.classList.toggle('active', l.dataset.slug === demo.slug))
    }

    list.addEventListener('click', e => {
      const a = e.target.closest('a')
      if (!a) return
      e.preventDefault()
      const slug = a.dataset.slug
      history.replaceState(null, '', '#' + slug)
      load(slug)
    })

    window.addEventListener('hashchange', () => load(location.hash.slice(1)))

    load(location.hash.slice(1) || 'status-dot')
  </script>
</body>
</html>
