<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态点 — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #191919;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    h1 {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #888;
    }

    .variants {
      display: flex;
      gap: 56px;
    }

    .variant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12px;
    }

    .num {
      color: #e8e8e8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .spec {
      color: #555;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 11px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .dot--success { background: #4ade80; }
    .dot--failure { background: #f87171; }
    .dot--normal  { background: #6b6b6b; }

    .note {
      font-size: 11px;
      color: #555;
      font-family: "SF Mono", Menlo, monospace;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>STATUS DOT</h1>
    <div class="variants">
      <div class="variant">
        <div class="label"><span class="num">成功</span><span class="spec">success</span></div>
        <div class="dot dot--success"></div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">失败</span><span class="spec">failure</span></div>
        <div class="dot dot--failure"></div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">普通</span><span class="spec">normal</span></div>
        <div class="dot dot--normal"></div>
      </div>
    </div>
    <p class="note">6px solid · 绿 #4ade80 · 红 #f87171 · 灰 #6b6b6b</p>
  </main>
</body>
</html>
