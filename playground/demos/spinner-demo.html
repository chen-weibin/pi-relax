<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆圈 Spinner — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #171717;
      color: #E5E5E5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 40px 0;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    h1 {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #888;
    }

    .variants {
      display: grid;
      grid-template-columns: repeat(5, auto);
      gap: 40px 56px;
    }

    .variant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-width: 110px;
    }

    .label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .num {
      color: #E5E5E5;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .spec {
      color: #555;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.3px;
    }

    .stage {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .note {
      font-size: 11px;
      color: #555;
      font-family: "SF Mono", Menlo, monospace;
      letter-spacing: 0.3px;
    }

    /* ============================================================
       Shared keyframes
       ============================================================ */
    @keyframes kf-spin       { to { transform: rotate(360deg);  } }
    @keyframes kf-spin-rev   { to { transform: rotate(-360deg); } }
    @keyframes kf-fade-30    { 0%, 100% { opacity: 0.15; } 30% { opacity: 1; } }
    @keyframes kf-fade-50    { 0%, 100% { opacity: 0.2;  } 50% { opacity: 1; } }
    @keyframes kf-arc-fade   { 0%, 100% { opacity: 0.25; } 33%, 40% { opacity: 1; } }
    @keyframes kf-fold {
      0%, 5%    { transform: perspective(120px) rotateX(-180deg); opacity: 0;   filter: brightness(1.4); }
      10%       { transform: perspective(120px) rotateX(-180deg); opacity: 0.5; filter: brightness(1.4); }
      25%, 75%  { transform: perspective(120px) rotateX(0deg);    opacity: 1;   filter: brightness(1);   }
      90%       { transform: perspective(120px) rotateY(180deg);  opacity: 0.5; filter: brightness(0.6); }
      95%, 100% { transform: perspective(120px) rotateY(180deg);  opacity: 0;   filter: brightness(0.6); }
    }
    @keyframes kf-c11 {
      0%   { background: #E5E5E5; }
      50%  { background: #555555; }
      100% { background: #E5E5E5; }
    }

    /* ============================================================
       1 · ring sweep · single
       ============================================================ */
    .s1 {
      width: 22px; height: 22px;
      border: 2px solid #2A2A2A;
      border-top-color: #E5E5E5;
      border-radius: 50%;
      animation: kf-spin 0.8s linear infinite;
    }

    /* ============================================================
       2 · dual counter-rotate
       ============================================================ */
    .s2 {
      position: relative; width: 26px; height: 26px;
    }
    .s2::before, .s2::after {
      content: ''; position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .s2::before {
      border-top-color: #E5E5E5;
      animation: kf-spin 0.9s linear infinite;
    }
    .s2::after {
      inset: 5px;
      border-bottom-color: #A1A1A1;
      animation: kf-spin-rev 1.4s linear infinite;
    }

    /* ============================================================
       3 · dot orbit · 8
       ============================================================ */
    .s3 { position: relative; width: 26px; height: 26px; }
    .s3__dot {
      position: absolute; left: 50%; top: 50%;
      width: 4px; height: 4px;
      margin: -2px;
      background: #E5E5E5;
      border-radius: 50%;
      transform-origin: 0 0;
      animation: kf-fade-50 1.1s ease-in-out infinite;
      opacity: 0.2;
    }
    .s3__dot:nth-child(1) { transform: rotate(0deg)   translate(13px); animation-delay: 0s;      }
    .s3__dot:nth-child(2) { transform: rotate(45deg)  translate(13px); animation-delay: 0.138s; }
    .s3__dot:nth-child(3) { transform: rotate(90deg)  translate(13px); animation-delay: 0.275s; }
    .s3__dot:nth-child(4) { transform: rotate(135deg) translate(13px); animation-delay: 0.413s; }
    .s3__dot:nth-child(5) { transform: rotate(180deg) translate(13px); animation-delay: 0.55s;  }
    .s3__dot:nth-child(6) { transform: rotate(225deg) translate(13px); animation-delay: 0.688s; }
    .s3__dot:nth-child(7) { transform: rotate(270deg) translate(13px); animation-delay: 0.825s; }
    .s3__dot:nth-child(8) { transform: rotate(315deg) translate(13px); animation-delay: 0.963s; }

    /* ============================================================
       4 · three arcs · 120°
       ============================================================ */
    .s4 {
      position: relative; width: 26px; height: 26px;
      animation: kf-spin 1.2s linear infinite;
    }
    .s4__arc {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #E5E5E5;
      animation: kf-arc-fade 1.5s ease-in-out infinite;
      opacity: 0.25;
    }
    .s4__arc:nth-child(1) { transform: rotate(0deg);   }
    .s4__arc:nth-child(2) { transform: rotate(120deg); animation-delay: 0.5s; }
    .s4__arc:nth-child(3) { transform: rotate(240deg); animation-delay: 1s;   }

    /* ============================================================
       5 · 12-bar · Material
       ============================================================ */
    .s5 { position: relative; width: 26px; height: 26px; }
    .s5__bar {
      position: absolute;
      left: 50%; top: 50%;
      width: 2px; height: 5px;
      margin-left: -1px;
      margin-top: -2.5px;
      transform-origin: 1px 12px;
      background: #E5E5E5;
      border-radius: 1px;
      animation: kf-fade-30 1.1s linear infinite;
      opacity: 0.15;
    }
    .s5__bar:nth-child(1)  { transform: rotate(0deg);   animation-delay: 0s;    }
    .s5__bar:nth-child(2)  { transform: rotate(30deg);  animation-delay: 0.083s; }
    .s5__bar:nth-child(3)  { transform: rotate(60deg);  animation-delay: 0.167s; }
    .s5__bar:nth-child(4)  { transform: rotate(90deg);  animation-delay: 0.25s;  }
    .s5__bar:nth-child(5)  { transform: rotate(120deg); animation-delay: 0.333s; }
    .s5__bar:nth-child(6)  { transform: rotate(150deg); animation-delay: 0.417s; }
    .s5__bar:nth-child(7)  { transform: rotate(180deg); animation-delay: 0.5s;   }
    .s5__bar:nth-child(8)  { transform: rotate(210deg); animation-delay: 0.583s; }
    .s5__bar:nth-child(9)  { transform: rotate(240deg); animation-delay: 0.667s; }
    .s5__bar:nth-child(10) { transform: rotate(270deg); animation-delay: 0.75s;  }
    .s5__bar:nth-child(11) { transform: rotate(300deg); animation-delay: 0.833s; }
    .s5__bar:nth-child(12) { transform: rotate(330deg); animation-delay: 0.917s; }

    /* ============================================================
       8 · 8-bar (variant of #5, fewer bars)
       ============================================================ */
    .s8 { position: relative; width: 26px; height: 26px; }
    .s8__bar {
      position: absolute;
      left: 50%; top: 50%;
      width: 2px; height: 5px;
      margin-left: -1px;
      margin-top: -2.5px;
      transform-origin: 1px 12px;
      background: #E5E5E5;
      border-radius: 1px;
      animation: kf-fade-30 1.2s linear infinite;
      opacity: 0.15;
    }
    .s8__bar:nth-child(1) { transform: rotate(0deg);   animation-delay: 0s;    }
    .s8__bar:nth-child(2) { transform: rotate(45deg);  animation-delay: 0.15s; }
    .s8__bar:nth-child(3) { transform: rotate(90deg);  animation-delay: 0.3s;  }
    .s8__bar:nth-child(4) { transform: rotate(135deg); animation-delay: 0.45s; }
    .s8__bar:nth-child(5) { transform: rotate(180deg); animation-delay: 0.6s;  }
    .s8__bar:nth-child(6) { transform: rotate(225deg); animation-delay: 0.75s; }
    .s8__bar:nth-child(7) { transform: rotate(270deg); animation-delay: 0.9s;  }
    .s8__bar:nth-child(8) { transform: rotate(315deg); animation-delay: 1.05s; }

    /* ============================================================
       9 · 10-bar (variant of #8)
       ============================================================ */
    .s9 { position: relative; width: 26px; height: 26px; }
    .s9__bar {
      position: absolute;
      left: 50%; top: 50%;
      width: 2px; height: 5px;
      margin-left: -1px;
      margin-top: -2.5px;
      transform-origin: 1px 12px;
      background: #E5E5E5;
      border-radius: 1px;
      animation: kf-fade-30 1s linear infinite;
      opacity: 0.15;
    }
    .s9__bar:nth-child(1)  { transform: rotate(0deg);    animation-delay: 0s;    }
    .s9__bar:nth-child(2)  { transform: rotate(36deg);   animation-delay: 0.1s;  }
    .s9__bar:nth-child(3)  { transform: rotate(72deg);   animation-delay: 0.2s;  }
    .s9__bar:nth-child(4)  { transform: rotate(108deg);  animation-delay: 0.3s;  }
    .s9__bar:nth-child(5)  { transform: rotate(144deg);  animation-delay: 0.4s;  }
    .s9__bar:nth-child(6)  { transform: rotate(180deg);  animation-delay: 0.5s;  }
    .s9__bar:nth-child(7)  { transform: rotate(216deg);  animation-delay: 0.6s;  }
    .s9__bar:nth-child(8)  { transform: rotate(252deg);  animation-delay: 0.7s;  }
    .s9__bar:nth-child(9)  { transform: rotate(288deg);  animation-delay: 0.8s;  }
    .s9__bar:nth-child(10) { transform: rotate(324deg);  animation-delay: 0.9s;  }

    /* ============================================================
       10 · fold (4 squares, perspective flip)
       ============================================================ */
    .s10 {
      width: 26px; height: 26px;
      position: relative;
    }
    .s10__square {
      position: absolute;
      width: 50%; height: 50%;
      background: #E5E5E5;
      border-radius: 1px;
      animation: kf-fold 1s ease-in-out infinite;
      transform-origin: 100% 100%;
    }
    .s10__square:nth-child(1) { background: #E5E5E5; }
    .s10__square:nth-child(2) { background: #C7C7C7; }
    .s10__square:nth-child(3) { background: #888888; }
    .s10__square:nth-child(4) { background: #555555; }
    .s10__square:nth-child(1) { top: 0;    left: 0;    }
    .s10__square:nth-child(2) { top: 0;    left: 50%; animation-delay: 0.25s; transform-origin: 0 100%; }
    .s10__square:nth-child(3) { top: 50%;  left: 50%; animation-delay: 0.5s;  transform-origin: 0 0; }
    .s10__square:nth-child(4) { top: 50%;  left: 0;   animation-delay: 0.75s; transform-origin: 100% 0; }

    /* ============================================================
       11 · fold + 3-color cycle (color shifts over time, not fixed)
       ============================================================ */
    .s11 {
      width: 26px; height: 26px;
      position: relative;
    }
    .s11__square {
      position: absolute;
      width: 50%; height: 50%;
      background: #E5E5E5;
      border-radius: 1px;
      animation: kf-fold 1s ease-in-out infinite,
                 kf-c11  1.5s linear infinite;
      transform-origin: 100% 100%;
    }
    .s11__square:nth-child(1) { top: 0;    left: 0;    animation-delay: 0s,     0s;       }
    .s11__square:nth-child(2) { top: 0;    left: 50%; animation-delay: 0.25s,  -0.375s;  transform-origin: 0 100%; }
    .s11__square:nth-child(3) { top: 50%;  left: 50%; animation-delay: 0.5s,   -0.75s;   transform-origin: 0 0; }
    .s11__square:nth-child(4) { top: 50%;  left: 0;   animation-delay: 0.75s,  -1.125s;  transform-origin: 100% 0; }

    /* ============================================================
       12 · fold · 3x3 grid (each square ~1/3 size, same fold motion)
       ============================================================ */
    .s12 {
      width: 26px; height: 26px;
      position: relative;
    }
    .s12__square {
      position: absolute;
      width: 33.333%; height: 33.333%;
      background: #E5E5E5;
      border-radius: 1px;
      animation: kf-fold 1.5s ease-in-out infinite;
    }
    .s12__square:nth-child(1) { top: 0;        left: 0;        transform-origin: 100% 100%; animation-delay: 0s;     background: #E5E5E5; }
    .s12__square:nth-child(2) { top: 0;        left: 33.333%;  transform-origin: 50% 100%;  animation-delay: 0.17s;  }
    .s12__square:nth-child(3) { top: 0;        left: 66.666%;  transform-origin: 0 100%;    animation-delay: 0.33s;  background: #C7C7C7; }
    .s12__square:nth-child(4) { top: 33.333%;  left: 0;        transform-origin: 100% 50%;  animation-delay: 0.5s;   }
    .s12__square:nth-child(5) { top: 33.333%;  left: 33.333%;  transform-origin: 50% 50%;    animation-delay: 0.67s;  }
    .s12__square:nth-child(6) { top: 33.333%;  left: 66.666%;  transform-origin: 0 50%;     animation-delay: 0.83s;  }
    .s12__square:nth-child(7) { top: 66.666%;  left: 0;        transform-origin: 100% 0;    animation-delay: 1s;     background: #888888; }
    .s12__square:nth-child(8) { top: 66.666%;  left: 33.333%;  transform-origin: 50% 0;      animation-delay: 1.17s;  }
    .s12__square:nth-child(9) { top: 66.666%;  left: 66.666%;  transform-origin: 0 0;       animation-delay: 1.33s;  background: #555555; }

    /* ============================================================
       6 · conic gradient · fade tail
       ============================================================ */
    .s6 {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(229, 229, 229, 0.15) 20deg,
        rgba(229, 229, 229, 0.4) 60deg,
        rgba(229, 229, 229, 0.7) 120deg,
        #E5E5E5 180deg,
        #E5E5E5 200deg,
        transparent 201deg
      );
      -webkit-mask: radial-gradient(circle, transparent 56%, #000 58%);
              mask: radial-gradient(circle, transparent 56%, #000 58%);
      animation: kf-spin 1s linear infinite;
    }

    /* ============================================================
       7 · conic gradient · round cap (SVG, 圆头封顶)
       ============================================================ */
    .s7 {
      width: 26px; height: 26px;
      animation: kf-spin 1s linear infinite;
    }
    .s7 svg { width: 100%; height: 100%; display: block; }

    /* ============================================================
       Accessibility
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .s1, .s2::before, .s2::after, .s3__dot,
      .s4, .s4__arc, .s5__bar, .s6, .s7, .s8__bar, .s9__bar, .s10__square, .s11__square, .s12__square {
        animation: none;
      }
      .s3__dot, .s5__bar, .s8__bar, .s9__bar { opacity: 0.6; }
      .s4__arc { opacity: 1; }
    }
  </style>
</head>
<body>
  <main>
    <h1>SPINNER · VARIANTS</h1>
    <div class="variants">
      <div class="variant">
        <div class="label"><span class="num">1</span><span class="spec">ring · sweep</span></div>
        <div class="stage"><div class="s1"></div></div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">2</span><span class="spec">dual · counter</span></div>
        <div class="stage"><div class="s2"></div></div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">3</span><span class="spec">8-dot · orbit</span></div>
        <div class="stage">
          <div class="s3">
            <span class="s3__dot"></span><span class="s3__dot"></span><span class="s3__dot"></span><span class="s3__dot"></span>
            <span class="s3__dot"></span><span class="s3__dot"></span><span class="s3__dot"></span><span class="s3__dot"></span>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">4</span><span class="spec">3-arc · rotate</span></div>
        <div class="stage">
          <div class="s4">
            <span class="s4__arc"></span><span class="s4__arc"></span><span class="s4__arc"></span>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">5</span><span class="spec">12-bar · fade</span></div>
        <div class="stage">
          <div class="s5">
            <span class="s5__bar"></span><span class="s5__bar"></span><span class="s5__bar"></span><span class="s5__bar"></span>
            <span class="s5__bar"></span><span class="s5__bar"></span><span class="s5__bar"></span><span class="s5__bar"></span>
            <span class="s5__bar"></span><span class="s5__bar"></span><span class="s5__bar"></span><span class="s5__bar"></span>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">6</span><span class="spec">conic · fade tail</span></div>
        <div class="stage"><div class="s6"></div></div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">7</span><span class="spec">conic · round cap</span></div>
        <div class="stage">
          <div class="s7">
            <svg viewBox="0 0 26 26" aria-hidden="true">
              <defs>
                <linearGradient id="s7-grad" x1="13" y1="2" x2="13" y2="24" gradientUnits="userSpaceOnUse">
                  <stop offset="0"    stop-color="#E5E5E5" stop-opacity="0"/>
                  <stop offset="0.15" stop-color="#E5E5E5" stop-opacity="0.15"/>
                  <stop offset="0.4"  stop-color="#E5E5E5" stop-opacity="0.4"/>
                  <stop offset="0.7"  stop-color="#E5E5E5" stop-opacity="0.7"/>
                  <stop offset="1"    stop-color="#E5E5E5" stop-opacity="1"/>
                </linearGradient>
              </defs>
              <path d="M 13 2 A 11 11 0 1 1 3.03 17.65"
                    fill="none"
                    stroke="url(#s7-grad)"
                    stroke-width="2"
                    stroke-linecap="butt"/>
              <circle cx="3.03" cy="17.65" r="1" fill="#E5E5E5"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">8</span><span class="spec">8-bar · fade</span></div>
        <div class="stage">
          <div class="s8">
            <span class="s8__bar"></span><span class="s8__bar"></span><span class="s8__bar"></span><span class="s8__bar"></span>
            <span class="s8__bar"></span><span class="s8__bar"></span><span class="s8__bar"></span><span class="s8__bar"></span>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">9</span><span class="spec">10-bar · fade</span></div>
        <div class="stage">
          <div class="s9">
            <span class="s9__bar"></span><span class="s9__bar"></span><span class="s9__bar"></span><span class="s9__bar"></span><span class="s9__bar"></span>
            <span class="s9__bar"></span><span class="s9__bar"></span><span class="s9__bar"></span><span class="s9__bar"></span><span class="s9__bar"></span>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">10</span><span class="spec">fold · flip</span></div>
        <div class="stage">
          <div class="s10">
            <span class="s10__square"></span><span class="s10__square"></span>
            <span class="s10__square"></span><span class="s10__square"></span>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">11</span><span class="spec">fold · 3-color cycle</span></div>
        <div class="stage">
          <div class="s11">
            <span class="s11__square"></span><span class="s11__square"></span>
            <span class="s11__square"></span><span class="s11__square"></span>
          </div>
        </div>
      </div>
      <div class="variant">
        <div class="label"><span class="num">12</span><span class="spec">fold · 3×3 grid</span></div>
        <div class="stage">
          <div class="s12">
            <span class="s12__square"></span><span class="s12__square"></span><span class="s12__square"></span>
            <span class="s12__square"></span><span class="s12__square"></span><span class="s12__square"></span>
            <span class="s12__square"></span><span class="s12__square"></span><span class="s12__square"></span>
          </div>
        </div>
      </div>
    </div>
    <p class="note">transform / opacity / conic-gradient / svg · respects prefers-reduced-motion</p>
  </main>
</body>
</html>
